<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company Sales Force Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="login-wrap">
      <article class="login-card">
        <h1>Company Sales Force 登入</h1>
        <p>請輸入帳號與密碼登入。</p>
        <p id="apiStatus" class="status-text">系統連線檢查中...</p>
        <form id="loginForm" class="login-form">
          <label>API 伺服器網址
            <input id="apiBase" required placeholder="例如：https://your-backend.onrender.com" />
          </label>
          <label>帳號
            <input id="loginUsername" required placeholder="例如：Chris" />
          </label>
          <label>密碼
            <input id="loginPassword" type="password" required />
          </label>
          <button type="submit" class="btn-primary">登入</button>
          <p id="loginError" class="error-text"></p>
        </form>
      </article>
    </section>
    <script src="app.js"></script>
  </body>
</html>
